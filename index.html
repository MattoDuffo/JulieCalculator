<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Julie's Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1 class="title">Julie's Calculator <span class="sparkle">✨</span></h1>

      <section class="calculator">
        <div class="display">
          <div class="expression" id="expression">&nbsp;</div>
          <div class="result" id="result">0</div>
        </div>

        <div class="keypad">
          <button class="key key--clear" data-action="clear">C</button>
          <button class="key key--clear" data-action="delete">⌫</button>
          <button class="key key--op" data-op="/">÷</button>
          <button class="key key--op" data-op="*">×</button>

          <button class="key" data-digit="7">7</button>
          <button class="key" data-digit="8">8</button>
          <button class="key" data-digit="9">9</button>
          <button class="key key--op" data-op="-">−</button>

          <button class="key" data-digit="4">4</button>
          <button class="key" data-digit="5">5</button>
          <button class="key" data-digit="6">6</button>
          <button class="key key--op" data-op="+">+</button>

          <button class="key" data-digit="1">1</button>
          <button class="key" data-digit="2">2</button>
          <button class="key" data-digit="3">3</button>
          <button class="key key--equals" data-action="equals">=</button>

          <button class="key key--wide" data-digit="0">0</button>
          <button class="key" data-action="dot">.</button>
        </div>
      </section>

      <p class="message" id="message">Pick some numbers and press = 💕</p>
    </main>

    <canvas id="fx" aria-hidden="true"></canvas>
    <div id="fx-layer" aria-hidden="true"></div>

    <script src="messages.js"></script>
    <script src="effects.js"></script>
    <script src="script.js"></script>
  </body>
</html>
